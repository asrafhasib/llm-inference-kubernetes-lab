apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
  namespace: llm-inference
  labels:
    app: qwen
    app.kubernetes.io/name: qwen-simulator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qwen
  template:
    metadata:
      labels:
        app: qwen
        app.kubernetes.io/name: qwen-simulator
    spec:
      containers:
        - name: qwen
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --model=demo/qwen3-0.6b
            - --port=8000
            - --max-num-seqs=4
            - --time-to-first-token=200ms
            - --inter-token-latency=30ms
            - --time-factor-under-load=2.0
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
